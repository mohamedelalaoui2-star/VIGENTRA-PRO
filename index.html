
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>VIGENTRA PRO</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d18;
      --panel: #111a2b;
      --panel-2: #0c1423;
      --line: rgba(148,163,184,.16);
      --text: #f4f7fc;
      --muted: #9aa9bf;
      --blue: #4f8cff;
      --red: #ef4444;
      --gold: #d7b778;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh; margin: 0; padding: 24px 16px 40px;
      max-width: 980px; margin-inline: auto;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(37,99,235,.17), transparent 38%),
        radial-gradient(ellipse at 100% 18%, rgba(239,68,68,.08), transparent 30%),
        var(--bg);
      color: var(--text); letter-spacing: .01em;
    }
    header {
      position: relative; padding: 24px 22px 20px; margin-bottom: 20px;
      border: 1px solid var(--line); border-radius: 22px;
      background: linear-gradient(135deg, rgba(20,32,52,.98), rgba(10,16,29,.96));
      box-shadow: 0 18px 50px rgba(0,0,0,.22); overflow: hidden;
    }
    header::after {
      content: ""; position: absolute; right: -38px; top: -72px;
      width: 190px; height: 190px; border: 1px solid rgba(215,183,120,.24);
      border-radius: 50%; box-shadow: 0 0 0 18px rgba(215,183,120,.035), 0 0 0 38px rgba(215,183,120,.025);
      pointer-events: none;
    }
    h1 { margin: 0 0 8px; color: #f6f8ff; font-size: clamp(27px, 6vw, 38px); letter-spacing: .12em; font-weight: 850; }
    header div { color: #c5d1e2; font-size: 14px; }
    h2 { margin: 0 0 16px; font-size: 17px; letter-spacing: .01em; }
    p { color: #c6d1e1; line-height: 1.5; }
    .card {
      position: relative; background: linear-gradient(145deg, rgba(19,29,47,.98), rgba(13,21,35,.98));
      border: 1px solid var(--line); padding: 21px; border-radius: 19px; margin-bottom: 16px;
      box-shadow: 0 12px 34px rgba(0,0,0,.16);
    }
    input, button {
      display: block; width: 100%; min-height: 49px; padding: 13px 15px; margin-top: 11px;
      border-radius: 11px; border: 1px solid rgba(148,163,184,.23);
      font: inherit; font-size: 15px; transition: border-color .18s, background .18s, transform .18s;
    }
    input { background: #091221; color: var(--text); outline: none; }
    input::placeholder { color: #74839a; }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79,140,255,.13); }
    button {
      background: linear-gradient(135deg, #3478f6, #2456c8); color: white;
      border: 1px solid rgba(147,184,255,.24); font-weight: 750; cursor: pointer;
      box-shadow: 0 7px 18px rgba(37,99,235,.18);
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(.99); }
    button.danger { background: linear-gradient(135deg, #e44752, #a91f31); box-shadow: 0 7px 18px rgba(185,28,28,.16); }
    .status {
      position: relative; z-index: 1; margin: 17px 0 0; padding: 11px 13px;
      border-radius: 10px; border: 1px solid rgba(79,140,255,.2);
      background: rgba(37,99,235,.08); color: #a9caff; font-size: 13px; overflow-wrap: anywhere;
    }
    .item {
      padding: 14px; background: linear-gradient(135deg, #0b1423, #101b2d);
      border: 1px solid var(--line); margin-top: 9px; border-radius: 12px;
      overflow-wrap: anywhere; color: #e8eef8; line-height: 1.5;
    }
    #agentCount, #siteCount { color: var(--gold); font-size: 23px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
    .hidden { display: none !important; }
    small { color: var(--muted); }
    @media (min-width: 700px) {
      body { padding: 36px 24px 54px; }
      #app { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
      #app > .card:first-child { grid-column: 1 / -1; }
      .card { padding: 24px; }
    }
    @media (max-width: 420px) {
      body { padding: 14px 12px 30px; }
      header { padding: 21px 17px 17px; border-radius: 18px; }
      .card { padding: 17px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>VIGENTRA PRO</h1>
    <div>Gestion professionnelle de sécurité privée</div>
    <p id="status" class="status">Configuration requise</p>
  </header>

  <section class="card" id="loginCard">
    <h2>Connexion</h2>
    <input id="configUrl" placeholder="https://vdoolfdxtqgjqzltxloo.supabase.co">
    <input id="configKey" placeholder="sb_publishable_KU1Rdv08vpOfvNxdCqno8Q_AN49L-Pd">
    <button id="connectBtn">Connecter Supabase</button>
    <hr>
    <input id="loginEmail" type="email" placeholder="Adresse e-mail">
    <input id="loginPassword" type="password" placeholder="Mot de passe">
    <button id="loginBtn">Se connecter</button>
    <button id="signupBtn">Créer mon compte</button>
  </section>

  <main id="app" class="hidden">
    <section class="card">
      <h2>Tableau de bord</h2>
      <p>Agents : <strong id="agentCount">0</strong></p>
      <p>Sites : <strong id="siteCount">0</strong></p>
      <button id="refreshBtn">Actualiser</button>
      <button id="logoutBtn" class="danger">Se déconnecter</button>
    </section>

    <section class="card">
      <h2>Ajouter un agent</h2>
      <input id="agentName" placeholder="Nom et prénom" required>
      <input id="agentEmail" type="email" placeholder="E-mail (facultatif)">
      <input id="agentPhone" type="tel" placeholder="Téléphone (facultatif)">
      <button id="addAgentBtn">Enregistrer l'agent</button>
      <div id="agentsList"></div>
    </section>

    <section class="card">
      <h2>Créer un site client</h2>
      <input id="siteName" placeholder="Nom du site client" required>
      <button id="addSiteBtn">Enregistrer le site</button>
      <div id="sitesList"></div>
    </section>

    <section class="card">
      <h2>Planning des vacations</h2>
      <label for="shiftAgent">Agent</label>
      <select id="shiftAgent" required><option value="">Choisir un agent</option></select>
      <label for="shiftSite">Site client</label>
      <select id="shiftSite" required><option value="">Choisir un site</option></select>
      <label for="shiftDate">Date</label>
      <input id="shiftDate" type="date" required>
      <div class="grid">
        <div><label for="shiftStart">Début</label><input id="shiftStart" type="time" required></div>
        <div><label for="shiftEnd">Fin</label><input id="shiftEnd" type="time" required></div>
      </div>
      <button id="addShiftBtn">Enregistrer la vacation</button>
      <div id="planningList"></div>
    </section>
  </main>

<script>
(() => {
  let db = null;
  let busy = false;

  const $ = id => document.getElementById(id);
  const status = message => { $("status").textContent = message; };

  function showError(error) {
    console.error(error);
    status("Erreur : " + (error?.message || String(error)));
  }

  function validConfig(url, key) {
    return /^https:\/\/[a-zA-Z0-9-]+\.supabase\.co\/?$/.test(url)
      && key.length > 20;
  }

  async function connect() {
    const url = $("configUrl").value.trim().replace(/\/$/, "");
    const key = $("configKey").value.trim();

    if (!validConfig(url, key)) {
      status("Vérifie l'URL Supabase et la clé publique.");
      return;
    }

    db = window.supabase.createClient(url, key);
    status("Supabase configuré. Connecte-toi à ton compte.");
  }

  async function login(createAccount = false) {
    if (!db) await connect();
    if (!db) return;

    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;

    if (!email || password.length < 6) {
      status("Entre ton e-mail et un mot de passe d'au moins 6 caractères.");
      return;
    }

    try {
      const result = createAccount
        ? await db.auth.signUp({ email, password })
        : await db.auth.signInWithPassword({ email, password });

      if (result.error) throw result.error;

      if (createAccount && !result.data.session) {
        status("Compte créé. Vérifie ton e-mail si Supabase le demande.");
        return;
      }

      status("Connexion réussie.");
      await loadApp();
    } catch (error) {
      showError(error);
    }
  }

  async function requireUser() {
    if (!db) throw new Error("Configure d'abord Supabase.");
    const { data, error } = await db.auth.getUser();
    if (error) throw error;
    if (!data.user) throw new Error("Connecte-toi avant cette opération.");
    return data.user;
  }

  async function loadApp() {
    try {
      await requireUser();
      $("loginCard").classList.add("hidden");
      $("app").classList.remove("hidden");
      await refreshData();
    } catch (error) {
      showError(error);
    }
  }

  async function refreshData() {
    try {
      const user = await requireUser();

      const [agentsResult, sitesResult, planningResult] = await Promise.all([
        db.from("agents").select("*").eq("user_id", user.id).order("nom"),
        db.from("Site").select("*").eq("user_id", user.id).order("Nom"),
        db.from("planning").select("*").eq("user_id", user.id).order("date_vacation", { ascending: false }).limit(100)
      ]);

      if (agentsResult.error) throw agentsResult.error;
      if (sitesResult.error) throw sitesResult.error;
      if (planningResult.error) throw planningResult.error;

      $("agentCount").textContent = agentsResult.data.length;
      $("siteCount").textContent = sitesResult.data.length;

      $("agentsList").replaceChildren();
      agentsResult.data.forEach(agent => {
        const item = document.createElement("div");
        item.className = "item";
        item.textContent = [
          [agent.Prenom, agent.nom].filter(Boolean).join(" "),
          agent.Email,
          agent["Téléphone"]
        ].filter(Boolean).join(" — ");
        $("agentsList").appendChild(item);
      });

      const agentSelect = $("shiftAgent");
      const priorAgent = agentSelect.value;
      agentSelect.replaceChildren(new Option("Choisir un agent", ""));
      agentsResult.data.forEach(agent => agentSelect.add(new Option([agent.Prenom, agent.nom].filter(Boolean).join(" ") || agent.nom || "Agent", String(agent.id))));
      if (priorAgent) agentSelect.value = priorAgent;

      const siteSelect = $("shiftSite");
      const priorSite = siteSelect.value;
      siteSelect.replaceChildren(new Option("Choisir un site", ""));
      sitesResult.data.forEach(site => siteSelect.add(new Option(site.Nom || "Site", String(site.id))));
      if (priorSite) siteSelect.value = priorSite;

      $("sitesList").replaceChildren();
      sitesResult.data.forEach(site => {
        const item = document.createElement("div");
        item.className = "item";
        item.textContent = site.Nom;
        $("sitesList").appendChild(item);
      });

      $("planningList").replaceChildren();
      planningResult.data.forEach(shift => {
        const agent = agentsResult.data.find(a => String(a.id) === String(shift.agent_id));
        const site = sitesResult.data.find(x => String(x.id) === String(shift.site_id));
        const item = document.createElement("div");
        item.className = "item";
        item.textContent = [shift.date_vacation, (shift.heure_debut || "").slice(0,5) + "–" + (shift.heure_fin || "").slice(0,5), agent ? [agent.Prenom, agent.nom].filter(Boolean).join(" ") : "Agent", site ? site.Nom : "Site", shift.statut || "prévue"].filter(Boolean).join(" — ");
        $("planningList").appendChild(item);
      });

      status("VIGENTRA PRO connecté à Supabase.");
    } catch (error) {
      showError(error);
    }
  }

  async function addAgent() {
    if (busy) return;
    const agentName = $("agentName").value.trim();
    if (!agentName) {
      status("Entre le nom et prénom de l'agent.");
      return;
    }

    busy = true;
    try {
      const user = await requireUser();
      const agent = {
        user_id: user.id,
        nom: agentName,
        Email: $("agentEmail").value.trim() || null,
        "Téléphone": $("agentPhone").value.trim() || null
      };

      const { error } = await db.from("agents").insert(agent);
      if (error) throw error;

      $("agentName").value = "";
      $("agentEmail").value = "";
      $("agentPhone").value = "";
      status("Agent enregistré.");
      await refreshData();
    } catch (error) {
      showError(error);
    } finally {
      busy = false;
    }
  }

  async function addShift() {
    if (busy) return;
    const agentId = $("shiftAgent").value;
    const siteId = $("shiftSite").value;
    const date = $("shiftDate").value;
    const start = $("shiftStart").value;
    const end = $("shiftEnd").value;
    if (!agentId || !siteId || !date || !start || !end) {
      status("Complète l'agent, le site, la date et les horaires.");
      return;
    }
    if (start === end) {
      status("L'heure de fin doit être différente de l'heure de début.");
      return;
    }
    busy = true;
    try {
      const user = await requireUser();
      const { error } = await db.from("planning").insert({
        user_id: user.id,
        agent_id: Number(agentId),
        site_id: Number(siteId),
        date_vacation: date,
        heure_debut: start,
        heure_fin: end,
        statut: "prévue"
      });
      if (error) throw error;
      $("shiftDate").value = "";
      $("shiftStart").value = "";
      $("shiftEnd").value = "";
      status("Vacation enregistrée.");
      await refreshData();
    } catch (error) {
      showError(error);
    } finally {
      busy = false;
    }
  }

  async function addSite() {
    if (busy) return;
    const name = $("siteName").value.trim();
    if (!name) {
      status("Entre le nom du site client.");
      return;
    }

    busy = true;
    try {
      const user = await requireUser();
      const { error } = await db.from("Site").insert({
        user_id: user.id,
        Nom: name
      });
      if (error) throw error;

      $("siteName").value = "";
      status("Site client enregistré.");
      await refreshData();
    } catch (error) {
      showError(error);
    } finally {
      busy = false;
    }
  }

  $("connectBtn").addEventListener("click", connect);
  $("loginBtn").addEventListener("click", () => login(false));
  $("signupBtn").addEventListener("click", () => login(true));
  $("addAgentBtn").addEventListener("click", addAgent);
  $("addSiteBtn").addEventListener("click", addSite);
  $("addShiftBtn").addEventListener("click", addShift);
  $("refreshBtn").addEventListener("click", refreshData);
  $("logoutBtn").addEventListener("click", async () => {
    try {
      const { error } = await db.auth.signOut();
      if (error) throw error;
      $("app").classList.add("hidden");
      $("loginCard").classList.remove("hidden");
      status("Déconnecté.");
    } catch (error) {
      showError(error);
    }
  });

  $("configUrl").value = "";
  $("configKey").value = "";

  status("Entre l'URL et la clé publique de Supabase.");
})();
</script>
</body>
</html>
